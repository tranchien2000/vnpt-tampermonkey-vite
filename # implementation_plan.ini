# implementation_plan.md

## 🎯 Mục tiêu
1. Loại bỏ các cơ chế chờ đợi cứng (sleep 1000ms).
2. Tăng độ chính xác khi tìm kiếm form địa chỉ (không dùng index cố định [2]).
3. Giảm tải CPU khi gõ phím và quét DOM.

---

## 🛠️ Bước 1: Tối ưu hoá tầng định vị (DOM Positioning)
**Vấn đề:** `getVNPTAddressGroup` đang dùng `mainRows[2]`, dễ bị vỡ layout.
- [ ] **Action:** Thay thế logic index bằng **Contextual Search**.
- [ ] **Detail:** Tìm phần tử có text là "Địa chỉ" hoặc "Địa chỉ trụ sở", sau đó xác định container cha (`.row`) chứa nó. 
- [ ] **Benefit:** Script sẽ hoạt động đúng ngay cả khi VNPT thêm hàng hoặc thay đổi cấu trúc bảng.

---

## 🛠️ Bước 2: Tối ưu hoá cơ chế Sequential Fill (Sync liên hoàn)
**Vấn đề:** Dùng `sleep(1000)` gây chậm trễ lãng phí hoặc lỗi nếu mạng cực chậm.
- [ ] **Action:** Chuyển sang **State-driven Polling**.
- [ ] **Detail:** 
    - Thay vì đợi 1s, hãy poll dropdown Huyện/Xã liên tục (mỗi 100ms) cho đến khi `options.length > 1`.
    - Thêm **Dependency Guard**: Chỉ điền Huyện nếu Tỉnh đã được gán giá trị thành công.
- [ ] **Benefit:** Tăng tốc độ điền lên 2-3 lần (điền ngay khi AJAX xong).

---

## 🛠️ Bước 3: Nâng cấp `syncSetValue` & Library Interop
**Vấn đề:** Một số trường Select2 không nhận trigger `change` chuẩn.
- [ ] **Action:** Chuẩn hóa logic trigger cho **Select2** và **ng-select2**.
- [ ] **Detail:** 
    - Ưu tiên dùng `$(el).val(v).trigger('change.select2')` nếu jQuery khả dụng.
    - Cải thiện logic bóc tách `parseAddressComponents` để không bóc tách lại nhiều lần cho cùng một chuỗi dữ liệu.
- [ ] **Benefit:** Dữ liệu "ăn" vào form 100%, không bị tình trạng "nhìn thấy chữ nhưng lưu vào database bị rỗng".

---

## 🛠️ Bước 4: Tắt/Mở thông minh (Sync Management)
**Vấn đề:** Sync 2 chiều đôi khi gây lag khi gõ phím nhanh.
- [ ] **Action:** Áp dụng **Write-Lock mechanism** và **Optimistic Update**.
- [ ] **Detail:** 
    - Khi đang điền hàng loạt (`doFillData`), tạm thời ngắt các listener của `syncEngine` để tránh xung đột sự kiện.
    - Chỉ cho phép sync ngược (Form -> Widget) nếu người dùng thực sự tương tác (isTrusted event).
- [ ] **Benefit:** Loại bỏ hoàn toàn vòng lặp sync vô tận.

---

## 📈 Kết quả mong đợi
- Thời gian điền full một địa chỉ 3 cấp (Tỉnh-Huyện-Xã): **< 1.5s** (Hiện tại ~3s).
- Tỷ lệ lỗi "không khớp option": **Giảm 80%**.
- Độ trễ khi gõ phím trong Widget: **Gần như bằng 0**.
