name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Extract version and message
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          MESSAGE=$(jq -r .message version.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.meta.outputs.version }}
          body: |
            ## 🎉 ${{ steps.meta.outputs.message }}

            ### 📦 Installation

            **Tampermonkey:**
            1. Click on [myscript.user.js](https://github.com/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/myscript.user.js)
            2. Tampermonkey will auto-detect and prompt to install

            **Chrome Extension:**
            1. Download [vnpt-extension.zip](https://github.com/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/vnpt-extension.zip)
            2. Extract and load unpacked in Chrome

            ### 📝 Changelog
            See commit history for details.

            ---
            🤖 Auto-generated by GitHub Actions
          files: |
            dist/myscript.user.js
            dist/extension/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip Extension
        run: |
          cd dist/extension
          zip -r ../../vnpt-extension.zip .
          cd ../..

      - name: Upload Extension Zip
        uses: softprops/action-gh-release@v1
        with:
          files: vnpt-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
